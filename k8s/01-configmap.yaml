# Non-secret settings (docs/spec.md S14 defaults). Secrets and local overrides come from
# the app-secrets Secret, created from .env by `make kind-up` and never committed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: shop-floor
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
  REDIS_URL: "redis://redis:6379/0"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
  MEDIA_ROOT: "/app/media"
  LOG_LEVEL: "INFO"
  MAX_UPLOAD_MB: "200"
  MAX_VIDEO_SECONDS: "130"
  EVENT_TYPES_FILE: "agent/event_types.yaml"
  # Same fallback as Compose: the demo runs with no API key. .env can switch to gemini.
  LLM_PROVIDER: "mock"
  LLM_INPUT_PRICE_PER_MTOK: "0"
  LLM_OUTPUT_PRICE_PER_MTOK: "0"
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "3"
  LLM_MAX_REQUESTS_PER_MINUTE: "8"
  AGENT_MAX_ITERATIONS: "3"
  AGENT_MAX_FRAMES: "120"
  AGENT_MAX_TOKENS: "200000"
  AGENT_MAX_COST_USD: "0.50"
  AGENT_MAX_LLM_CALLS: "20"
  AGENT_REPORT_RESERVE_TOKENS: "4000"
  AGENT_RUN_TIMEOUT_SECONDS: "600"
  SURVEY_INTERVAL_S: "2"
  SCENE_THRESHOLD: "0.4"
  INSPECT_FPS: "2"
  WINDOW_PADDING_S: "2"
  FRAMES_PER_CALL: "12"
  FRAME_MAX_SIDE: "768"
  CONFIDENCE_THRESHOLD: "0.6"
  MOCK_LATENCY_MS: "300"
