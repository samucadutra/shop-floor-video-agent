# One command local run: docker compose up
# Values come from .env when it exists; the defaults below make it work without one
# (mock LLM provider, local-only credentials).

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-local-dev-key-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DATABASE_URL: ${DATABASE_URL:-postgres://app:app@postgres:5432/shopfloor}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  MEDIA_ROOT: /app/media
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopfloor}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: shop-floor-backend:dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi -b 0.0.0.0:8000 -w 2 --timeout 120"
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    image: shop-floor-backend:dev
    command: celery -A config worker -l info -c 1
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: shop-floor-frontend:dev
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
